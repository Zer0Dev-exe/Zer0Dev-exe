<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Hi, I'm Zer0Dev — Data-Driven Solutions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a18"/>
      <stop offset="0.55" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#140a2e"/>
    </linearGradient>
    <linearGradient id="zGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.45" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="txtGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#bd93f9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e3a8a" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- Fondo -->
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="170" cy="150" r="190" fill="url(#halo)"/>
    <circle cx="1060" cy="140" r="200" fill="url(#haloR)"/>

    <!-- Circuitos -->
    <g fill="none" stroke="#1d4ed8" stroke-opacity="0.45" stroke-width="2">
      <path id="c1" d="M0 46 H120 L150 16 H330"/>
      <path id="c2" d="M0 262 H90 L120 286 H360 L380 266 H560"/>
      <path id="c3" d="M300 40 H520 L545 15 H760"/>
      <path id="c4" d="M640 286 H820 L845 262 H930"/>
    </g>
    <g fill="#38bdf8">
      <circle cx="330" cy="16" r="3.5"/><circle cx="560" cy="266" r="3.5"/>
      <circle cx="760" cy="15" r="3.5"/><circle cx="930" cy="262" r="3.5"/>
    </g>
    <!-- Datos fluyendo por los circuitos -->
    <g fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
      <use href="#c1" stroke-dasharray="18 600"><animate attributeName="stroke-dashoffset" from="618" to="0" dur="3.2s" repeatCount="indefinite"/></use>
      <use href="#c2" stroke-dasharray="18 700"><animate attributeName="stroke-dashoffset" from="718" to="0" dur="4s" repeatCount="indefinite"/></use>
      <use href="#c3" stroke-dasharray="18 600"><animate attributeName="stroke-dashoffset" from="618" to="0" dur="3.6s" begin="1s" repeatCount="indefinite"/></use>
      <use href="#c4" stroke-dasharray="18 400"><animate attributeName="stroke-dashoffset" from="418" to="0" dur="2.8s" begin="0.5s" repeatCount="indefinite"/></use>
    </g>

    <!-- Logo Z </> -->
    <g>
      <circle cx="170" cy="151" r="104" fill="#060c1f" stroke="url(#ring)" stroke-width="3" stroke-opacity="0.85"/>
      <circle cx="170" cy="151" r="114" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 10">
        <animateTransform attributeName="transform" type="rotate" from="0 170 151" to="360 170 151" dur="30s" repeatCount="indefinite"/>
      </circle>
      <polygon points="100,80 240,80 240,106 138,196 240,196 240,222 100,222 100,196 202,106 100,106"
               fill="url(#zGrad)" stroke="#93c5fd" stroke-opacity="0.6" stroke-width="1.5" filter="url(#glow)"/>
      <rect x="128" y="132" width="84" height="38" rx="9" fill="#050a18" stroke="#38bdf8" stroke-opacity="0.7"/>
      <text x="170" y="159" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,'Courier New',monospace"
            font-size="24" font-weight="700" fill="#e0f2fe">&lt;/&gt;</text>
    </g>

    <!-- Texto -->
    <g font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,'Courier New',monospace">
      <text x="330" y="128" font-size="52" font-weight="800" fill="#f1f5f9" letter-spacing="2">HI, I'M ZER0DEV</text>
      <rect x="814" y="88" width="24" height="44" fill="#bd93f9">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <text x="332" y="180" font-size="30" font-weight="700" fill="url(#txtGrad)" letter-spacing="3">DATA-DRIVEN SOLUTIONS</text>
      <rect x="332" y="198" width="430" height="2" fill="url(#txtGrad)" opacity="0.6"/>
      <text x="332" y="232" font-size="15" font-weight="600" fill="#94a3b8" letter-spacing="2">BIG DATA │ IA │ BACKEND │ FULL-STACK │ ASTRO │ AIRFLOW</text>
    </g>

    <!-- Red neuronal -->
    <g transform="translate(940 0)">
      <g stroke="#6366f1" stroke-opacity="0.45" stroke-width="1.3">
        <line x1="20" y1="80" x2="110" y2="60"/><line x1="20" y1="80" x2="110" y2="130"/><line x1="20" y1="80" x2="110" y2="200"/>
        <line x1="20" y1="160" x2="110" y2="60"/><line x1="20" y1="160" x2="110" y2="130"/><line x1="20" y1="160" x2="110" y2="200"/>
        <line x1="20" y1="230" x2="110" y2="130"/><line x1="20" y1="230" x2="110" y2="200"/>
        <line x1="110" y1="60" x2="200" y2="100"/><line x1="110" y1="130" x2="200" y2="100"/><line x1="110" y1="200" x2="200" y2="100"/>
        <line x1="110" y1="60" x2="200" y2="180"/><line x1="110" y1="130" x2="200" y2="180"/><line x1="110" y1="200" x2="200" y2="180"/>
      </g>
      <!-- Señales viajando por la red -->
      <g fill="#7dd3fc" filter="url(#glow)">
        <circle r="3"><animateMotion dur="2.4s" repeatCount="indefinite" path="M20 160 L110 130 L200 100"/></circle>
        <circle r="3"><animateMotion dur="2.8s" begin="-0.8s" repeatCount="indefinite" path="M20 80 L110 200 L200 180"/></circle>
        <circle r="3" fill="#bd93f9"><animateMotion dur="3.1s" begin="-1.5s" repeatCount="indefinite" path="M20 230 L110 130 L200 180"/></circle>
      </g>
      <g stroke="#a5b4fc" stroke-width="2" fill="#0b1430">
        <circle cx="20" cy="80" r="9"/><circle cx="20" cy="160" r="9"/><circle cx="20" cy="230" r="9"/>
        <circle cx="110" cy="60" r="10"><animate attributeName="fill" values="#0b1430;#3b82f6;#0b1430" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle cx="110" cy="130" r="10"><animate attributeName="fill" values="#0b1430;#8b5cf6;#0b1430" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
        <circle cx="110" cy="200" r="10"><animate attributeName="fill" values="#0b1430;#3b82f6;#0b1430" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
        <circle cx="200" cy="100" r="11" stroke="#38bdf8"/><circle cx="200" cy="180" r="11" stroke="#bd93f9"/>
      </g>
    </g>

    <!-- Borde -->
    <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="url(#ring)" stroke-opacity="0.35" stroke-width="2"/>
  </g>
</svg>
