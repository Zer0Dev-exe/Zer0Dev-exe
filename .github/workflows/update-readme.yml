# Regenera la lista de proyectos del README (ordenada por fecha de creación).
name: Actualizar lista de proyectos

on:
  schedule:
    - cron: "0 5 * * *"   # todos los días a las 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_repos.py
      - .github/workflows/update-readme.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generar tabla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_repos.py
      - name: Commit si ha cambiado
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: actualizar lista de proyectos"
          git push
